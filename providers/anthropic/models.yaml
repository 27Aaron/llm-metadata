# Anthropic (Claude) model metadata.
#
# `default_reasoning_effort` is the level the Claude API applies when a request
# does not set `output_config.effort`. Verified 2026-09-16: every model below
# defaults to `high` — "By default, Claude uses high effort", and `high` is
# "Equivalent to not setting the parameter".
#   https://platform.claude.com/docs/en/build-with-claude/effort
#
# This is the API default, not the Claude Code default. Since Opus 4.7, Claude
# Code raises its default effort to `xhigh` for all plans.
#   https://www.anthropic.com/news/claude-opus-4-7
provider: anthropic
models:
  - id: claude-fable-5
    name: "Claude Fable 5"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-fable-5-1
    name: "Claude Fable 5.1"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-mythos-5
    name: "Claude Mythos 5"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-mythos-5-1
    name: "Claude Mythos 5.1"
    reasoning_levels: [low, medium, high, xhigh, max]
