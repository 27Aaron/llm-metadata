# Anthropic (Claude) 模型元数据。
#
# `default_reasoning_effort` 是请求未设置 `output_config.effort` 时 Claude API
# 应用的等级。2026-09-16 核实：以下所有模型都默认 `high`——官方文档称
# "Claude 默认使用 high effort"，且 `high` 等同于不设置该参数。
#   https://platform.claude.com/docs/en/build-with-claude/effort
#
# 这里记录的是 API 默认值，不是 Claude Code 的默认值：自 Opus 4.7 起，
# Claude Code 将所有套餐的默认 effort 提升为 `xhigh`。
#   https://www.anthropic.com/news/claude-opus-4-7
provider: anthropic
models:
  - id: claude-fable-5
    name: "Claude Fable 5"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-fable-5-1
    name: "Claude Fable 5.1"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-mythos-5
    name: "Claude Mythos 5"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-mythos-5-1
    name: "Claude Mythos 5.1"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-opus-4-5-20251101
    name: "Claude Opus 4.5"
    reasoning_levels: [low, medium, high]
    default_reasoning_effort: high
  - id: claude-opus-4-6
    name: "Claude Opus 4.6"
    reasoning_levels: [low, medium, high, max]
    default_reasoning_effort: high
  - id: claude-opus-4-7
    name: "Claude Opus 4.7"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-opus-4-8
    name: "Claude Opus 4.8"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-opus-5
    name: "Claude Opus 5"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
  - id: claude-sonnet-4-6
    name: "Claude Sonnet 4.6"
    reasoning_levels: [low, medium, high, max]
    # API 默认是 `high`；文档建议应用以 `medium` 作为起点——那是建议，
    # 不是 API 默认值。
    default_reasoning_effort: high
  - id: claude-sonnet-5
    name: "Claude Sonnet 5"
    reasoning_levels: [low, medium, high, xhigh, max]
    default_reasoning_effort: high
