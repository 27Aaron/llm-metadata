# Moonshot (Kimi) 模型元数据。
#
# `default_reasoning_effort` 是请求未设置 `reasoning_effort` 时的 API 默认值。
# 2026-09-16 按以下文档核实：
#   https://platform.kimi.com/docs/guide/use-reasoning-effort
#   https://platform.kimi.com/docs/api/models-overview
#   https://platform.kimi.com/docs/models
#
# 注意：Kimi Code 产品有自己的默认值（K3 与 k3-256k：`high`；K2.8 Preview：
# `max`），与 API 默认不同。
#   https://www.kimi.com/code/docs/kimi-code/models.html
# 已退役的模型会被移除；审计与移除记录见 ../README.md。
provider: moonshot
models:
  - id: kimi-k2.6
    name: "Kimi K2.6"
    # 不支持 `reasoning_effort`；思考由 `thinking.type` 控制（默认开启）。
  - id: kimi-k2.7-code
    name: "Kimi K2.7 Code"
    # 不支持 `reasoning_effort`；思考始终开启。
  - id: kimi-k2.7-code-highspeed
    name: "Kimi K2.7 Code HighSpeed"
    # 与 kimi-k2.7-code 是同一模型（仅输出更快）。
  - id: kimi-k2.8
    name: "Kimi K2.8 Preview"
    reasoning_levels: [low, high, max]
    # Kimi Code 产品侧模型；platform.kimi.com 的 API 文档未覆盖它。
    # Kimi Code 列出的产品默认是 `max`；未文档化 API 默认值，因此留空。
  - id: kimi-k3
    name: "Kimi K3"
    reasoning_levels: [low, high, max]
    # API 默认是 `max`："该字段支持 \"low\" / \"high\" / \"max\" 三档，默认 \"max\""。
    default_reasoning_effort: max
  - id: kimi-k3-256k
    name: "Kimi K3 256K"
    reasoning_levels: [low, high, max]
    # platform.kimi.com 未收录该模型（2026-09-16 核实）。Kimi Code 列出了
    # `k3-256k`，产品默认为 `high`；未文档化 API 默认值，因此留空。
