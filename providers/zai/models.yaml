# Z.ai (GLM) 模型元数据。
#
# `default_reasoning_effort` 即 `reasoning_effort` 的默认值。2026-09-16 按
# 以下文档核实：
#   https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
#   https://docs.bigmodel.cn/cn/guide/start/concept-param
#
# `reasoning_effort_aliases` 记录额外接受的值及各自映射到的等级，
# 适用于文档中描述了此类映射的模型。
provider: zai
models:
  - id: glm-5.2
    name: "GLM-5.2"
    reasoning_levels: [low, high, max]
    # 官方说明："GLM-5.2 模型支持 max xhigh high medium low minimal none，
    # 传入 none 或 minimal 模型会放弃思考；传入 low medium 将映射为 high；
    # 传入 xhigh 将映射为 max"。快速参考表将 max/high/low 列为该参数的取值。
    # https://docs.bigmodel.cn/cn/guide/start/concept-param
    reasoning_effort_aliases:
      xhigh: max
      medium: high
      minimal: none
    default_reasoning_effort: max
  - id: glm-5.3
    name: "GLM-5.3"
    reasoning_levels: [low, high, max]
    # "`reasoning_effort` | `low`, `high`, `max` | Default `max`" —— 该模型
    # 不接受 `xhigh`。
    default_reasoning_effort: max
  - id: glm-5.3-flash
    name: "GLM-5.3 Flash"
    reasoning_levels: [low, high, max]
    # 与 GLM-5.3 相同：默认 `max`，不接受 `xhigh`。
    default_reasoning_effort: max
