# Z.ai (GLM) model metadata.
#
# `default_reasoning_effort` is the `reasoning_effort` default. Checked
# 2026-09-16 against:
#   https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
#   https://docs.bigmodel.cn/cn/guide/start/concept-param
#
# `reasoning_effort_aliases` records extra accepted values and the level each
# one maps to, for models whose docs describe such mappings.
provider: zai
models:
  - id: glm-5.2
    name: "GLM-5.2"
    reasoning_levels: [low, high, max]
    # Official note: "GLM-5.2 模型支持 max xhigh high medium low minimal none,
    # 传入 none 或 minimal 模型会放弃思考；传入 low medium 将映射为 high；
    # 传入 xhigh 将映射为 max". The quick-reference table lists max/high/low
    # as the parameter's values.
    # https://docs.bigmodel.cn/cn/guide/start/concept-param
    reasoning_effort_aliases:
      xhigh: max
      medium: high
      minimal: none
    default_reasoning_effort: max
  - id: glm-5.3
    name: "GLM-5.3"
    reasoning_levels: [low, high, max]
    # "`reasoning_effort` | `low`, `high`, `max` | Default `max`" — `xhigh` is
    # not a valid value for this model.
    default_reasoning_effort: max
  - id: glm-5.3-flash
    name: "GLM-5.3 Flash"
    reasoning_levels: [low, high, max]
    # Same as GLM-5.3: default `max`, no `xhigh`.
    default_reasoning_effort: max
