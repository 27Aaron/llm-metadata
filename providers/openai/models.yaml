# OpenAI 模型元数据。
#
# `default_reasoning_effort` 是请求未设置 `reasoning.effort` 时 API 应用的
# 等级。OpenAI 的默认值因模型而异（官方原话："Defaults are also
# model-dependent rather than universal"），因此每个条目在下方单独注明出处；
# 文档未写明默认值的模型有意不填该字段。已退役的模型会被移除；
# 审计与移除记录见 ../README.md。
#
# 备注：GPT-5 家族的较早快照和 o3（如 gpt-5-2025-08-07、gpt-5-mini-2025-08-07、
# o3-2025-04-16）计划于 2026-12-11 关停；模型 ID 本身仍然可用。
provider: openai
models:
  - id: codex-auto-review
    name: "Codex Auto Review"
    # 未核实：文档未列出支持的 effort 值（2026-09-16 核实）。
    reasoning_levels: [low, medium, high, xhigh]
    # 该 Codex 变体没有文档化的默认值。
  - id: gpt-5
    name: "GPT-5"
    reasoning_levels: [minimal, low, medium, high]
    # GPT-5.1 更新日志：GPT-5.1 默认使用新的 `none` 推理设置（"defaults to a
    # new `none` reasoning setting"），与 GPT-5 之前的 `medium` 默认不同。
    # https://developers.openai.com/api/docs/changelog
    default_reasoning_effort: medium
  - id: gpt-5-mini
    name: "GPT-5 Mini"
    # 未核实：文档未列出支持的 effort 值（2026-09-16 核实）。
    reasoning_levels: [low, medium, high]
    # 依 GPT-5.1 更新日志，GPT-5 家族默认 `medium`；模型页面本身不再重述
    # 默认值。GPT-5 Nano 同理。
    default_reasoning_effort: medium
  - id: gpt-5-nano
    name: "GPT-5 Nano"
    # 未核实：文档未列出支持的 effort 值（2026-09-16 核实）。
    reasoning_levels: [low, medium, high]
    default_reasoning_effort: medium
  - id: gpt-5.1
    name: "GPT-5.1"
    reasoning_levels: [none, low, medium, high]
    # 官方模型页："Reasoning.effort supports: none (default), low, medium,
    # and high."（支持 none（默认）、low、medium、high）
    # https://developers.openai.com/api/docs/models/gpt-5.1
    default_reasoning_effort: none
  - id: gpt-5.2
    name: "GPT-5.2"
    reasoning_levels: [none, low, medium, high, xhigh]
    # 官方模型页："Reasoning.effort supports: none (default), low, medium,
    # high and xhigh."
    # https://developers.openai.com/api/docs/models/gpt-5.2
    default_reasoning_effort: none
  - id: gpt-5.3-codex
    name: "GPT-5.3 Codex"
    reasoning_levels: [low, medium, high, xhigh]
    # 官方模型页："GPT-5.3-Codex supports `low`, `medium`, `high`, and `xhigh`
    # reasoning effort settings."
    # https://developers.openai.com/api/docs/models/gpt-5.3-codex
    # 未文档化默认值（2026-09-16 核实）；留空。
  - id: gpt-5.3-codex-spark
    name: "GPT 5.3 Codex Spark"
    # 未核实：当前文档中没有该模型页面（2026-09-16 核实）。
    reasoning_levels: [low, medium, high, xhigh]
    # 未文档化默认值（2026-09-16 核实）；留空。
  - id: gpt-5.4
    name: "GPT-5.4"
    reasoning_levels: [none, low, medium, high, xhigh]
    # 官方模型页："Reasoning.effort supports: none (default), low, medium,
    # high and xhigh."
    # https://developers.openai.com/api/docs/models/gpt-5.4
    default_reasoning_effort: none
  - id: gpt-5.4-mini
    name: "GPT-5.4 Mini"
    reasoning_levels: [none, low, medium, high, xhigh]
    # 与 GPT-5.4 相同："none (default)"。
    # https://developers.openai.com/api/docs/models/gpt-5.4-mini
    default_reasoning_effort: none
  - id: gpt-5.4-nano
    name: "GPT-5.4 Nano"
    reasoning_levels: [none, low, medium, high, xhigh]
    # 与 GPT-5.4 相同："none (default)"。
    # https://developers.openai.com/api/docs/models/gpt-5.4-nano
    default_reasoning_effort: none
  - id: gpt-5.4-pro
    name: "GPT-5.4 Pro"
    reasoning_levels: [medium, high, xhigh]
    # 官方模型页："Reasoning.effort supports: medium (default), high and xhigh."
    # https://developers.openai.com/api/docs/models/gpt-5.4-pro
    default_reasoning_effort: medium
  - id: gpt-5.5
    name: "GPT-5.5"
    reasoning_levels: [none, low, medium, high, xhigh]
    # 官方模型页："Reasoning.effort supports: none, low, medium (default),
    # high and xhigh."
    # https://developers.openai.com/api/docs/models/gpt-5.5
    default_reasoning_effort: medium
  - id: gpt-5.5-pro
    name: "GPT-5.5 Pro"
    reasoning_levels: [medium, high, xhigh]
    # 官方模型页："Reasoning.effort supports: medium, high (default) and xhigh."
    # https://developers.openai.com/api/docs/models/gpt-5.5-pro
    default_reasoning_effort: high
  - id: gpt-5.6-luna
    name: "GPT-5.6 Luna"
    reasoning_levels: [none, low, medium, high, xhigh, max]
    # GPT-5.6 家族："If you omit `reasoning.effort`, GPT-5.6 defaults to
    # `medium` in both modes."（省略 effort 时两种模式下都默认 medium）
    # GPT-5.6 Sol 与 GPT-5.6 Terra 同理。
    # https://developers.openai.com/api/docs/guides/reasoning
    default_reasoning_effort: medium
  - id: gpt-5.6-sol
    name: "GPT-5.6 Sol"
    reasoning_levels: [none, low, medium, high, xhigh, max]
    # 官方模型页："Reasoning.effort supports: none, low, medium (default),
    # high, xhigh, and max."
    # https://developers.openai.com/api/docs/models/gpt-5.6-sol
    default_reasoning_effort: medium
  - id: gpt-5.6-terra
    name: "GPT-5.6 Terra"
    reasoning_levels: [none, low, medium, high, xhigh, max]
    default_reasoning_effort: medium
  - id: gpt-6-astra
    name: "GPT-6 Astra"
    reasoning_levels: [low, medium, high, xhigh, max]
    # 模型页面列出了支持的取值，但未说明默认值（2026-09-16 核实）。
    # https://developers.openai.com/api/docs/models/gpt-6-astra
