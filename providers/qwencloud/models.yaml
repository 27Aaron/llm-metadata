# QwenCloud (Alibaba Qwen) model metadata.
#
# Covers Alibaba's own Qwen models only. QwenCloud also serves third-party
# models (DeepSeek, GLM, Kimi); those are tracked under their own provider
# directories (deepseek/, zai/, moonshot/).
#
# Reasoning levels: on QwenCloud only the Qwen3.8 series exposes
# `reasoning_effort` depth levels (`low` / `medium` / `xhigh`, default
# `xhigh`). The Qwen3.7 series has no effort levels at all: officially it is
# a hybrid thinking model — `enable_thinking` toggles thinking on/off
# (true = think first, false = reply directly) and is ON by default — plus a
# `thinking_budget` token cap. Its entries therefore carry
# `reasoning_switch: true` with `default_reasoning_enabled: true` instead of
# levels. Earlier families (Qwen3.6, Qwen3.5, Qwen3, Qwen3-VL, Qwen3-Coder,
# Qwen-Max/Plus/Flash/Turbo, QwQ) behave the same way but are not tracked yet.
#
# Qwen3.8 levels — all five series members share them (checked 2026-09-17):
#   "Qwen3.8 series: Options: `low`, `medium`, `xhigh`. Default: `xhigh`."
#   https://docs.qwencloud.com/api-reference/chat/openai-chat
#   The launch post and the open-source model cards announce the same three
#   levels with `xhigh` as default:
#   https://qwen.ai/blog?id=qwen3.8
#   https://huggingface.co/Qwen/Qwen3.8-27B
#   https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
#
# `reasoning_effort_aliases` — OpenAI's standard names are accepted on top of
# the native levels and mapped onto them: `minimal` → `low`, `high` → `xhigh`,
# `max` → `xhigh`. `none` is not a level: it maps to `enable_thinking=false`
# (thinking off).
#   https://docs.qwencloud.com/api-reference/chat/openai-responses
#
# Of the Qwen3.8 series, only `qwen3.8-max` exists in LiteLLM's catalog
# today; the other members are curated ahead of upstream and start publishing
# once LiteLLM adds them (skipped until then). Both Qwen3.7 entries are in
# the catalog already.
provider: qwencloud
models:
  - id: qwen3.7-max
    name: "Qwen3.7-Max"
    reasoning_switch: true
    # Hybrid thinking model: `enable_thinking` toggles thinking on/off
    # (true = think first, false = reply directly); thinking is ON by
    # default. No `reasoning_effort` levels exist for this family.
    # https://docs.qwencloud.com/developer-guides/text-generation/thinking
    default_reasoning_enabled: true
  - id: qwen3.7-plus
    name: "Qwen3.7-Plus"
    reasoning_switch: true
    # Same control as qwen3.7-max: "thinking mode is enabled by default for
    # qwen3.7-plus" and can be disabled with `enable_thinking=false`.
    # https://docs.qwencloud.com/developer-guides/text-generation/thinking
    default_reasoning_enabled: true
  - id: qwen3.8-2.4t-a95b
    name: "Qwen3.8-2.4T-A95B"
    # Open-source member; thinking-only.
    # https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
    reasoning_levels: [low, medium, xhigh]
    reasoning_effort_aliases:
      minimal: low
      high: xhigh
      max: xhigh
    default_reasoning_effort: xhigh
  - id: qwen3.8-27b
    name: "Qwen3.8-27B"
    # Open-source member; hybrid thinking (on by default).
    # https://huggingface.co/Qwen/Qwen3.8-27B
    reasoning_levels: [low, medium, xhigh]
    reasoning_effort_aliases:
      minimal: low
      high: xhigh
      max: xhigh
    default_reasoning_effort: xhigh
  - id: qwen3.8-flash
    name: "Qwen3.8-Flash"
    # Same series-level effort behaviour as qwen3.8-max
    # https://docs.qwencloud.com/api-reference/chat/openai-chat
    reasoning_levels: [low, medium, xhigh]
    reasoning_effort_aliases:
      minimal: low
      high: xhigh
      max: xhigh
    default_reasoning_effort: xhigh
  - id: qwen3.8-max
    name: "Qwen3.8-Max"
    # https://docs.qwencloud.com/api-reference/chat/openai-chat
    reasoning_levels: [low, medium, xhigh]
    reasoning_effort_aliases:
      minimal: low
      high: xhigh
      max: xhigh
    default_reasoning_effort: xhigh
  - id: qwen3.8-max-0902
    name: "Qwen3.8-Max-0902"
    # Snapshot of qwen3.8-max (alias qwen3.8-max-2026-09-02)
    # https://docs.qwencloud.com/api-reference/chat/openai-chat
    reasoning_levels: [low, medium, xhigh]
    reasoning_effort_aliases:
      minimal: low
      high: xhigh
      max: xhigh
    default_reasoning_effort: xhigh
