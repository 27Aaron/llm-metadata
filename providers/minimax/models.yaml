# MiniMax model metadata.
#
# MiniMax exposes no reasoning-effort *depth* levels: on the OpenAI-compatible
# endpoint (used by Codex), `reasoning.effort` is a thinking on/off switch for
# MiniMax-M3 — any non-`none` value (e.g. `high`) turns on Adaptive Thinking,
# `none` turns it off, and the value does not adjust reasoning depth.
#   https://platform.minimax.cn/docs/token-plan/codex
#
# On the Anthropic-compatible endpoint the same behaviour is controlled by
# `thinking.type` (`adaptive` / `disabled`); `output_config.effort` is not
# supported there, and on the M2.x family thinking cannot be disabled.
#   https://platform.minimax.io/docs/api-reference/text-openai-api
#   https://platform.minimax.io/docs/api-reference/text-anthropic-api
#
# `reasoning_levels` mirrors the accepted `reasoning.effort` values. Model IDs
# follow MiniMax's own API names; the highspeed variants are not yet present in
# LiteLLM's catalog (which lists older `-lightning` names), so they are skipped
# until upstream catches up.
provider: minimax
models:
  - id: MiniMax-M3
    name: "MiniMax M3"
    reasoning_levels: [none, high]
    # "对于 MiniMax-M3，任意非 `none` 值都会开启 Adaptive Thinking；该值不
    # 用于调节 reasoning 深度" — the Codex model catalog defaults to `high`,
    # matching the OpenAI-compatible endpoint's default (thinking on).
    # https://platform.minimax.cn/docs/token-plan/codex
    default_reasoning_effort: high
  - id: MiniMax-M2.7
    name: "MiniMax M2.7"
    reasoning_levels: [high]
    # M2.x thinking cannot be disabled, so `none` is unavailable; the
    # effective default is `high` (inferred from the thinking docs).
    default_reasoning_effort: high
  - id: MiniMax-M2.7-highspeed
    name: "MiniMax M2.7 HighSpeed"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2.5
    name: "MiniMax M2.5"
    reasoning_levels: [high]
    # Legacy model; same thinking behaviour as the M2.x family.
    default_reasoning_effort: high
  - id: MiniMax-M2.5-highspeed
    name: "MiniMax M2.5 HighSpeed"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2.1
    name: "MiniMax M2.1"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2.1-highspeed
    name: "MiniMax M2.1 HighSpeed"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2
    name: "MiniMax M2"
    reasoning_levels: [high]
    default_reasoning_effort: high
