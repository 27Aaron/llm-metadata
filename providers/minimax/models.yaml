# MiniMax 模型元数据。
#
# MiniMax 没有 effort 深度等级：在 OpenAI 兼容端点（Codex 使用的端点）上，
# `reasoning.effort` 对 MiniMax-M3 而言是思考开关——任意非 `none` 值（如
# `high`）开启 Adaptive Thinking，`none` 关闭，值本身不调节思考深度。
#   https://platform.minimax.cn/docs/token-plan/codex
#
# 在 Anthropic 兼容端点上，同样的行为由 `thinking.type`（`adaptive` /
# `disabled`）控制；该端点不支持 `output_config.effort`，并且 M2.x 系列
# 无法关闭思考。
#   https://platform.minimax.io/docs/api-reference/text-openai-api
#   https://platform.minimax.io/docs/api-reference/text-anthropic-api
#
# `reasoning_levels` 对应可接受的 `reasoning.effort` 值。模型 ID 采用 MiniMax
# 官方 API 名称；highspeed 变体尚未进入 LiteLLM 目录（目录中仍是旧的
# `-lightning` 名称），在上游跟上之前会被跳过。
provider: minimax
models:
  - id: MiniMax-M3
    name: "MiniMax M3"
    reasoning_levels: [none, high]
    # "对于 MiniMax-M3，任意非 `none` 值都会开启 Adaptive Thinking；该值不
    # 用于调节 reasoning 深度" —— Codex 模型目录默认 `high`，与 OpenAI 兼容
    # 端点的默认一致（思考开启）。
    # https://platform.minimax.cn/docs/token-plan/codex
    default_reasoning_effort: high
  - id: MiniMax-M2.7
    name: "MiniMax M2.7"
    reasoning_levels: [high]
    # M2.x 无法关闭思考，因此没有 `none`；有效默认值是 `high`
    # （根据思考相关文档推断）。
    default_reasoning_effort: high
  - id: MiniMax-M2.7-highspeed
    name: "MiniMax M2.7 HighSpeed"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2.5
    name: "MiniMax M2.5"
    reasoning_levels: [high]
    # 旧版模型；思考行为与 M2.x 系列相同。
    default_reasoning_effort: high
  - id: MiniMax-M2.5-highspeed
    name: "MiniMax M2.5 HighSpeed"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2.1
    name: "MiniMax M2.1"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2.1-highspeed
    name: "MiniMax M2.1 HighSpeed"
    reasoning_levels: [high]
    default_reasoning_effort: high
  - id: MiniMax-M2
    name: "MiniMax M2"
    reasoning_levels: [high]
    default_reasoning_effort: high
