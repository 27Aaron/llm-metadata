name: Refresh providers.json

# 每天四次拉取 LiteLLM 发布的模型目录，并在上游数据变化时提交提取出的
# 提供方允许清单。
on:
  push:
    branches:
      - main
  schedule:
    # UTC 04:00 / 10:00 / 16:00 / 22:00 = UTC+8 的 12:00 / 18:00 / 00:00 / 06:00。
    # GitHub 繁忙时定时任务可能延迟几分钟执行，但总是在默认分支的最新提交上运行。
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-providers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # build_providers.py 需要读取策展的 models.yaml 文件（PyYAML）。
        run: python -m pip install pyyaml

      - name: Extract the provider catalog
        run: python scripts/build_providers.py --verbose

      - name: Commit and push when the catalog changed
        run: |
          # 先暂存，这样首次运行（文件尚未被跟踪）也计为一次变更；
          # 再用 `git diff --cached --quiet` 判断是否有实际变化。
          git add providers.json
          if git diff --cached --quiet; then
            echo "providers.json is already up to date"
            exit 0
          fi
          # user.name/user.email 同时设置作者与提交者。
          git config user.name "Aaron"
          git config user.email "85681241+27Aaron@users.noreply.github.com"
          git commit \
            -m "chore: refresh providers.json" \
            -m "Co-authored-by: Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          git push
